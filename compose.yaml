name: aigc-detector
services:
  app:
    image: aigc-detector:gpu
    build:
      context: .
    ports:
      - "${AIGC_BIND_HOST:-0.0.0.0}:${AIGC_PORT:-5000}:5000"
    environment:
      AIGC_ENABLE_TRANSFORMER: "0"
      AIGC_TRANSFORMER_DEVICE: cuda
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - logs:/app/backend/logs
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 1gb
volumes:
  logs:
